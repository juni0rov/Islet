name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Build app
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export ISLET_VERSION="${GITHUB_REF_NAME#v}"
          fi
          ./scripts/build-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Islet
          path: dist/Islet-*.zip*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Islet-*.zip
            dist/Islet-*.zip.sha256
          generate_release_notes: true
